name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Verify shared quota against Redis
        run: |
          command -v redis-server || (sudo apt-get update -qq && sudo apt-get install -y redis-server)
          pnpm test:quota

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Production build and E2E smoke
        run: pnpm test:e2e
